spring.application.name=cycle-shop-backend
server.port=${PORT:8080}

# Load environment variables from .env file
spring.config.import=optional:file:./.env[.properties]

# Supabase PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.cycleshop=INFO
logging.level.org.springframework.web=INFO